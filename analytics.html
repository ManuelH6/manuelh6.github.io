<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Manuel Assogba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090b;--surface:#111115;--fg:#ffffff;--muted:#8b8b96;--accent:#10b981;--border:#27272f;--green:#10b981;--red:#ef4444}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}

/* Gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate-box{width:100%;max-width:360px;padding:0 24px;text-align:center}
.gate-logo{font-size:1rem;font-weight:900;letter-spacing:-.04em;margin-bottom:48px;color:var(--muted)}
.gate-logo span{color:var(--accent)}
.gate-title{font-size:1.5rem;font-weight:900;letter-spacing:-.04em;margin-bottom:8px}
.gate-sub{font-size:.8rem;color:var(--muted);margin-bottom:24px}
.gate-label{display:block;text-align:left;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.gate-inp{width:100%;min-height:46px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 16px;font-size:1rem;font-weight:600;color:var(--fg);outline:none;text-align:center;letter-spacing:.2em;font-family:'Inter',sans-serif;transition:border-color .2s}
.gate-inp:focus{border-color:var(--accent)}
.gate-btn{margin-top:12px;width:100%;min-height:46px;padding:12px 16px;background:var(--accent);color:var(--bg);font-weight:700;font-size:.85rem;border:none;border-radius:6px;cursor:pointer;transition:opacity .2s}
.gate-btn:hover{opacity:.9}
.gate-err{margin-top:12px;font-size:.75rem;color:var(--red);font-weight:600;min-height:20px}

/* Dashboard */
#dash{display:none;min-height:100vh;padding:40px 0 80px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.dash-logo{font-size:.95rem;font-weight:900;letter-spacing:-.04em}
.dash-logo span{color:var(--accent)}
.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logout-btn{min-height:44px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:10px 16px;border-radius:6px;border:1px solid var(--red);color:var(--red);background:transparent;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.logout-btn:hover{background:var(--red);color:#fff}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0;overflow:hidden;height:800px}

.status{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:600}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <p class="gate-logo">MANUEL<span>.</span>analytics</p>
    <h1 class="gate-title">Accès privé</h1>
    <p class="gate-sub">Consultez les statistiques de fréquentation du portfolio</p>
    <label for="pwd-inp" class="gate-label">Mot de passe</label>
    <input id="pwd-inp" type="password" class="gate-inp" placeholder="••••••••" autocomplete="current-password">
    <button class="gate-btn" onclick="checkPassword()">Accéder au tableau de bord</button>
    <p class="gate-err" id="gate-err" role="alert"></p>
  </div>
</div>

<div id="dash">
  <div class="wrap">
    <div class="top-bar">
      <div>
        <div class="dash-logo">MANUEL<span>.</span>analytics</div>
        <div class="status" style="margin-top:6px">Tableau de bord Looker Studio</div>
      </div>
      <div class="top-right">
        <button class="logout-btn" onclick="logout()">Déconnexion</button>
      </div>
    </div>

    <div class="chart-card">
      <iframe width="100%" height="100%" title="Statistiques Looker Studio" src="https://datastudio.google.com/embed/reporting/89eb510e-bcf0-40de-bb67-407f3213be09/page/hpQyF" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  PASSWORD: 'manuel2025',
};

function checkPassword() {
  const val = document.getElementById('pwd-inp').value;
  if (val === CONFIG.PASSWORD) {
    sessionStorage.setItem('analytics_auth', '1');
    showDash();
  } else {
    document.getElementById('gate-err').textContent = 'Mot de passe incorrect.';
    document.getElementById('pwd-inp').value = '';
  }
}

document.getElementById('pwd-inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

function logout() {
  sessionStorage.removeItem('analytics_auth');
  location.reload();
}

function showDash() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
}

if (sessionStorage.getItem('analytics_auth') === '1') showDash();
</script>
</body>
</html>
